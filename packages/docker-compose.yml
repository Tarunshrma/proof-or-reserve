version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    ports:
      - "8082:8082"
    volumes:
      - ./backend/data:/app/data
      - ./backend/config:/app/config
    restart: unless-stopped

  por-frontend:
    build:
      context: ./por-frontend
      dockerfile: Dockerfile
    env_file:
      - ./por-frontend/.env
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped 